name: CI/CD - Build & Deploy Spring Boot

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            chien147/shop-backend:latest
            chien147/shop-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            WORK_DIR="/home/shopbe/shop-backend"
            REPO_URL="https://github.com/qchien04/ShopBE.git"

            mkdir -p $WORK_DIR
            cd $WORK_DIR

            # Ghi .env
            cat > .env << 'ENVEOF'
            ${{ secrets.ENV_FILE }}
            ENVEOF

            if [ ! -d ".git" ]; then
            git init
            git remote add origin $REPO_URL
            git fetch origin main
            git reset --hard origin/main
            else
            git remote set-url origin $REPO_URL
            git fetch origin main
            git reset --hard origin/main
            fi
            
            rsync -av --ignore-existing uploads/ $WORK_DIR/uploads/ 2>/dev/null || true

            docker compose up -d postgres

            echo "Chờ postgres sẵn sàng..."
            export $(grep -v '^#' .env | xargs)
            until docker exec pgvector-db pg_isready -U $POSTGRES_USER -d $POSTGRES_DB; do
            sleep 2
            done
            echo "Postgres sẵn sàng!"

            echo "Reset schema..."
            
            docker exec pgvector-db psql -U $POSTGRES_USER $POSTGRES_DB -c "DROP SCHEMA public CASCADE;"
            docker exec pgvector-db psql -U $POSTGRES_USER $POSTGRES_DB -c "CREATE SCHEMA public;"
            docker exec -i pgvector-db psql -U $POSTGRES_USER $POSTGRES_DB < shop_backup.sql
            
            # Pull image mới và restart backend
            docker compose pull backend
            docker compose up -d --no-deps --force-recreate backend
            docker image prune -f

            echo "Deploy thành công!"